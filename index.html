<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daytrack 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F5F6F4;--panel:#FFFFFF;--panel-2:#FBFBFA;--hover:#F6F7F5;--hover-2:#ECECEA;
    --ink:#1B1E23;--muted:#6B7280;--faint:#9AA1A9;
    --line:#E3E5E1;--line-strong:#D3D6D0;
    --accent:#174E4A;--accent-hover:#12403C;--accent-soft:#E7EFED;--accent-soft-h:#DCEBE8;--accent-line:#BFD6D1;
    --danger:#B4232A;--track:#ECEEEA;--field:#FFFFFF;--seg-bg:#FFFFFF;--chip-bg:#FFFFFF;
    --cd-green:#216E58;--cd-stub:#E4E7E2;--cd-today:#14161A;--tot-gray:#C0C4BD;
    --overlay:rgba(27,30,35,.36);--shadow:rgba(27,30,35,.30);
    --radius:14px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);
    --display:'Space Grotesk',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --bg:#15171B;--panel:#1D2025;--panel-2:#212429;--hover:#252A30;--hover-2:#2A2F36;
    --ink:#E9EBED;--muted:#9AA0A8;--faint:#6C727A;
    --line:#2B2F36;--line-strong:#3A3F48;
    --accent:#34A07E;--accent-hover:#3CB48D;--accent-soft:#1C3A33;--accent-soft-h:#234A41;--accent-line:#2F5B51;
    --danger:#E5726F;--track:#2A2F36;--field:#22262C;--seg-bg:#22262C;--chip-bg:#22262C;
    --cd-green:#34A07E;--cd-stub:#2E333B;--cd-today:#EEF1F3;--tot-gray:#5C636C;
    --overlay:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;transition:background .25s var(--ease),color .25s var(--ease)}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 26px 60px}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .wordmark{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em;line-height:1;color:var(--ink)}
  .wordmark .dot{color:var(--accent)}
  .tagline{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .divider{width:1px;height:20px;background:var(--line-strong);margin:0 3px}
  .weeklabel{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-0.01em;min-width:186px;text-align:center;color:var(--ink)}

  .btn{font-family:var(--body);font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),transform .09s ease}
  .btn:hover{background:var(--panel-2);border-color:var(--faint)}
  .btn:active{transform:translateY(1px) scale(.985)}
  .btn.icon{padding:7px 11px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .btn.icon svg{display:block}
  .btn.today{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  .btn.today:hover{background:var(--accent-soft-h)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .menu-wrap{position:relative}
  .menu-pop{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -18px var(--shadow);padding:6px;min-width:168px;display:none;flex-direction:column;z-index:60}
  .menu-pop.open{display:flex;animation:fadeIn .16s var(--ease) both}
  .menu-pop button{display:flex;align-items:center;gap:9px;border:none;background:transparent;color:var(--ink);font-family:var(--body);font-size:13px;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s var(--ease)}
  .menu-pop button:hover{background:var(--hover)}

  .segmented{position:relative;display:inline-flex;padding:3px;border-radius:10px;background:var(--seg-bg);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .segmented .seg-ind{position:absolute;left:0;top:3px;height:calc(100% - 6px);width:0;background:var(--accent);border-radius:7px;transform:translateX(0);transition:transform .34s var(--spring),width .34s var(--spring);z-index:0;pointer-events:none}
  .segmented button{position:relative;z-index:1;border:none;background:transparent;font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 13px;cursor:pointer;white-space:nowrap;transition:color .25s var(--ease)}
  .segmented button.on{color:#fff}
  .segmented button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px}
  .type-seg{display:flex;width:100%}
  .type-seg button{flex:1;text-align:center;padding:9px 8px;font-size:13px}

  .meter{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:22px}
  .meter .label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none;transition:color .16s var(--ease)}
  .meter .label:hover{color:var(--accent)}
  .meter .track{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
  .meter .fill{height:100%;background:var(--accent);border-radius:99px;width:0%;transition:width .55s var(--ease)}
  .meter .stat{font-family:var(--display);font-weight:600;font-size:16px;min-width:44px;text-align:right;transition:color .3s var(--ease)}
  .meter .count{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}

  .board{display:grid;gap:12px;align-items:stretch}
  .board.view-week{grid-template-columns:repeat(7,minmax(0,1fr))}
  .board.view-3day{grid-template-columns:repeat(3,minmax(0,1fr))}
  .board.view-day{grid-template-columns:minmax(0,480px)}
  @media (max-width:1120px){ .board.view-week{grid-template-columns:repeat(7,200px);overflow-x:auto;padding-bottom:10px} }

  .col{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;min-height:220px;transition:box-shadow .25s var(--ease),border-color .25s var(--ease)}
  .col.animate{animation:rise .5s var(--ease) both}
  .col:hover{box-shadow:0 8px 24px -16px var(--shadow)}
  .col.is-today{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
  .col.is-past{background:var(--panel-2)}
  .col.drop-active{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}

  .spine{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--track)}
  .spine .lvl{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent);transition:height .5s var(--ease)}

  .col-head{padding:13px 14px 10px 17px;border-bottom:1px solid var(--line);transition:background .3s var(--ease)}
  .col.is-today .col-head{background:var(--accent-soft)}
  .dow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .col.is-today .dow{color:var(--accent)}
  .datenum-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px}
  .datenum{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;letter-spacing:-0.02em}
  .col.is-today .datenum{color:var(--accent)}
  .frac{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .frac b{color:var(--ink);font-weight:500;transition:color .3s var(--ease)}
  .col.full .frac b{color:var(--accent)}

  .tasklist{padding:8px 8px 6px 13px;flex:1;display:flex;flex-direction:column;gap:2px;min-height:60px}
  .task{display:flex;align-items:flex-start;gap:8px;padding:6px 6px 6px 5px;border-radius:8px;position:relative;overflow:hidden;cursor:grab;transition:background .14s var(--ease),opacity .18s var(--ease)}
  .task:hover{background:var(--hover)}
  .task.entering{animation:rowIn .32s var(--ease) both}
  .task.dragging{opacity:.35;cursor:grabbing;background:var(--hover-2)}

  .check{flex:none;width:17px;height:17px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:5px;background:var(--field);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s var(--ease),border-color .2s var(--ease),transform .12s var(--spring)}
  .check:hover{border-color:var(--accent)}
  .check:active{transform:scale(.84)}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .check.done{background:var(--accent);border-color:var(--accent)}
  .check svg{width:11px;height:11px;display:block;transform:scale(0);opacity:0;transition:transform .24s var(--spring),opacity .14s var(--ease)}
  .check.done svg{transform:scale(1);opacity:1}

  .cat-dot{flex:none;width:7px;height:7px;border-radius:99px;margin-top:6px}
  .task-title{flex:1;min-width:0;font-size:13px;line-height:1.4;cursor:text;color:var(--ink);overflow-wrap:anywhere}
  .tt-inner{color:var(--ink);background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 60%;background-size:0% 1.5px;transition:background-size .28s var(--ease),color .24s var(--ease);-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .task.done .task-title{color:var(--faint)}
  .task.done .tt-inner{color:var(--faint);background-size:100% 1.5px}

  .del{flex:none;border:none;background:transparent;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:15px;line-height:1;padding:0 2px;opacity:0;transform:scale(.8);transition:opacity .15s var(--ease),transform .15s var(--ease),color .12s var(--ease)}
  .task:hover .del,.del:focus-visible{opacity:1;transform:scale(1)}
  .del:hover{color:var(--danger)}
  .del:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .rename-input{flex:1;font-family:var(--body);font-size:13px;border:1px solid var(--accent);border-radius:5px;padding:2px 5px;outline:none;background:var(--field);color:var(--ink)}
  .empty{color:var(--faint);font-size:12px;font-style:italic;padding:10px 6px;animation:fadeIn .3s var(--ease) both}
  .drop-line{height:0;border-top:2px solid var(--accent);border-radius:2px;margin:1px 5px;pointer-events:none}

  .g-hin::-webkit-outer-spin-button,.g-hin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .add-task{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--body);font-size:12.5px;padding:9px 14px 12px 15px;transition:color .14s var(--ease),background .14s var(--ease)}
  .add-task:hover{color:var(--accent);background:var(--hover)}
  .add-task:active{background:var(--hover-2)}
  .add-task .plus{font-family:var(--mono);font-size:14px;line-height:1;transition:transform .18s var(--spring)}
  .add-task:hover .plus{transform:rotate(90deg)}
  .add-task:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}

  /* Goal panel */
  .goal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:18px;display:flex;align-items:stretch;overflow:hidden}
  .g-left{flex:none;width:300px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .g-sec{padding:16px 20px}
  .g-sec + .g-sec{border-top:1px solid var(--line)}
  .g-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .g-eyebrow b{color:var(--accent);font-weight:500}
  .g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .g-title{display:inline-flex;align-items:center;gap:7px;margin-top:3px;border:none;background:transparent;padding:2px 6px 2px 0;border-radius:7px;cursor:text;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink);max-width:190px}
  .g-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-title svg{flex:none;color:var(--faint);opacity:0;transition:opacity .15s var(--ease)}
  .g-title:hover svg,.g-title:focus-visible svg{opacity:1}
  .g-title-in{margin-top:2px;width:190px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:2px 7px;outline:none;background:var(--field)}
  .g-btn{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 10px;cursor:pointer;font-family:var(--body);font-size:12.5px;font-weight:500;transition:background .14s var(--ease),border-color .14s var(--ease),color .14s var(--ease)}
  .g-btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .g-days{display:flex;align-items:baseline;gap:7px;border:none;background:transparent;padding:4px 8px 4px 0;margin-left:-0px;border-radius:9px;cursor:pointer;text-align:left;transition:background .14s var(--ease)}
  .g-days:hover .g-big{color:var(--accent)}
  .g-big{font-family:var(--display);font-weight:600;font-size:44px;line-height:.9;letter-spacing:-.035em;color:var(--ink);transition:color .15s var(--ease)}
  .g-tot{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--tot-gray)}
  .g-unit{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .g-prog{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 8px}
  .g-prog div{height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
  .g-meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
  .g-hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:20px;white-space:nowrap}
  .g-link{border:none;background:transparent;color:var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:2px 4px;border-radius:5px}
  .g-link:hover{background:var(--accent-soft)}
  .g-hctl{display:flex;align-items:center;gap:12px}
  .g-stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--field)}
  .g-step{width:38px;height:44px;border:none;background:transparent;color:var(--ink);font-family:var(--mono);font-size:19px;cursor:pointer;transition:background .14s var(--ease),color .14s var(--ease)}
  .g-step:hover{background:var(--accent-soft);color:var(--accent)}
  .g-step:active{background:var(--accent-soft-h)}
  .g-step:disabled{color:var(--faint);cursor:default;background:transparent}
  .g-hval{min-width:62px;height:44px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;cursor:text;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--ink);padding:0 8px}
  .g-hval small{font-size:13px;color:var(--faint);margin-left:1px}
  .g-hin{width:62px;height:44px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);outline:none;background:var(--accent-soft);text-align:center;font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);-moz-appearance:textfield}
  .g-hstats{display:flex;flex-direction:column;gap:2px;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .g-hstats .g-tgt{color:var(--faint);font-size:10.5px}
  .g-hstats b{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);margin-right:2px}
  .g-right{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px 12px}
  .g-tip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);height:22px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;margin-bottom:6px}
  .g-tip b{color:var(--ink);font-weight:500}
  .g-tip .dotsep{color:var(--faint)}
  .g-chart{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end}
  .g-chart svg{display:block;max-width:100%}
  .g-col{cursor:pointer}
  .g-chart svg > :not(.g-col){pointer-events:none} /* bars, labels and lines never block the day hover */
  @keyframes cdpulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}

  /* Goal modal */
  .field input.text[type="date"],.field input.text[type="number"]{font-family:var(--mono)}
  .g-row{display:flex;gap:10px}
  .g-row .field{flex:1}
  .g-preview{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .g-preview b{color:var(--ink);font-weight:500}
  .g-preview.bad{color:var(--danger);border-color:var(--danger)}
  .g-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .g-quick button{border:1px solid var(--line-strong);background:var(--field);color:var(--muted);border-radius:99px;padding:4px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
  .g-quick button:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .goal-foot{justify-content:space-between}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);font-family:var(--body);font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;box-shadow:0 14px 36px -14px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .28s var(--spring);z-index:120}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s .22s}
  .overlay.open{opacity:1;visibility:visible;transition:opacity .22s var(--ease)}
  .modal{background:var(--panel);border-radius:16px;width:100%;max-width:400px;box-shadow:0 24px 60px -20px var(--shadow);border:1px solid var(--line);transform:translateY(10px) scale(.97);opacity:0;transition:transform .26s var(--spring),opacity .2s var(--ease)}
  .overlay.open .modal{transform:none;opacity:1}
  .modal.wide{max-width:460px}
  .modal.analysis{max-width:660px}
  .modal-head{padding:18px 20px 4px}
  .modal-title{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-0.01em;color:var(--ink)}
  .modal-sub{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
  .modal-body{padding:14px 20px 4px;display:flex;flex-direction:column;gap:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
  .field input.text{width:100%;font-family:var(--body);font-size:14px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;outline:none;background:var(--field);color:var(--ink);transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
  .field input.text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .seg-note{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:7px;min-height:14px;transition:opacity .2s var(--ease)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--chip-bg);border-radius:99px;padding:5px 11px 5px 9px;font-size:12.5px;color:var(--ink);cursor:pointer;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),transform .1s ease}
  .chip:active{transform:scale(.96)}
  .chip .sw{width:9px;height:9px;border-radius:99px}
  .chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .modal-foot{padding:16px 20px 18px;display:flex;justify-content:flex-end;gap:9px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}

  #catList{max-height:56vh;overflow-y:auto}
  .catrow{display:flex;flex-direction:column;animation:rowIn .26s var(--ease) both}
  .catrow-main{display:flex;align-items:center;gap:10px}
  .cat-swatch{width:32px;height:32px;border-radius:9px;border:1px solid rgba(0,0,0,.14);cursor:pointer;flex:none;padding:0;transition:transform .1s ease,box-shadow .16s var(--ease)}
  .cat-swatch:hover{transform:scale(1.05)}
  .cat-swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .catrow.open .cat-swatch{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent-line)}
  .cname{flex:1;font-family:var(--body);font-size:13px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;outline:none;background:var(--field);color:var(--ink);transition:border-color .16s var(--ease)}
  .cname:focus{border-color:var(--accent)}
  .del-cat{border:none;background:transparent;color:var(--faint);font-family:var(--mono);font-size:17px;cursor:pointer;padding:2px 6px;transition:color .12s var(--ease)}
  .del-cat:hover{color:var(--danger)}
  .palette{display:none;flex-wrap:wrap;gap:8px;padding:11px 0 3px 42px}
  .catrow.open .palette{display:flex;animation:fadeIn .2s var(--ease) both}
  .swatch{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0;transition:transform .1s ease}
  .swatch:hover{transform:scale(1.12)}
  .swatch.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
  .swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cat-foot{justify-content:space-between}
  .add-cat-btn{font-size:12.5px;color:var(--accent);background:transparent;border:1px dashed var(--accent-line);border-radius:8px;padding:8px 13px;cursor:pointer;transition:background .16s var(--ease)}
  .add-cat-btn:hover{background:var(--accent-soft)}

  .analysis-body{max-height:68vh;overflow-y:auto;gap:22px;padding-bottom:6px}
  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat-card{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .stat-num{font-family:var(--display);font-weight:600;font-size:25px;line-height:1;letter-spacing:-0.02em;color:var(--ink)}
  .stat-cap{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .an-h{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .day-chart{display:flex;gap:5px;align-items:flex-end}
  .day-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .day-bar-area{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .day-bar{width:64%;min-width:6px;background:var(--accent);border-radius:5px 5px 0 0;transform-origin:bottom;animation:growY .55s var(--ease) both}
  .day-bar.today{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent-line)}
  .day-bar.empty{background:var(--line-strong);animation:none}
  .day-lbl{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:6px;white-space:nowrap}
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .cat-name{width:104px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .cat-track{flex:1;height:9px;background:var(--track);border-radius:99px;overflow:hidden}
  .cat-fill{height:100%;border-radius:99px;transform-origin:left;animation:growX .6s var(--ease) both}
  .cat-pct{font-family:var(--mono);font-size:11px;color:var(--muted);width:36px;text-align:right;flex:none}
  .wd-chart{display:flex;gap:8px;align-items:flex-end}
  .wd-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .wd-area{height:90px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .wd-bar{width:56%;min-width:8px;background:var(--accent);border-radius:5px 5px 0 0;transform-origin:bottom;animation:growY .5s var(--ease) both}
  .wd-bar.empty{background:var(--line-strong);animation:none}
  .wd-lbl{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px}
  .an-empty{color:var(--muted);font-size:13px;text-align:center;padding:34px 10px;line-height:1.6}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="wordmark">Daytrack<span class="dot">.</span></div>

    </div>
    <div class="nav">

      </div>
      <span class="divider"></span>
      <button class="btn icon" id="prevBtn" aria-label="Previous"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1L1 7l6 6"/></svg></button>
      <div class="weeklabel" id="weekLabel">—</div>
      <button class="btn icon" id="nextBtn" aria-label="Next"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></button>
      <button class="btn today" id="todayBtn">Today</button>
      <span class="divider"></span>
      <div class="menu-wrap">
        <button class="btn icon" id="menuBtn" aria-label="Menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="menu-pop" id="menuPop">
          <button data-act="analysis">Analysis</button>
          <button data-act="categories">Categories</button>
          <button data-act="export">Export</button>
          <button data-act="import">Import</button>
        </div>
      </div>
      <button class="btn icon" id="themeBtn" aria-label="Toggle light or dark mode"></button>
    </div>
  </header>

  <div class="meter">
    <span class="label" id="meterLabel" title="Click to switch between week and month">Week success</span>
    <div class="track"><div class="fill" id="weekFill"></div></div>
    <span class="stat" id="weekPct">0%</span>
    <span class="count" id="weekCount">0 / 0 done</span>

  <div class="board view-week" id="board"></div>

  <div class="goal" id="goal"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" style="display:none" />

<!-- Add task modal -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">New task</div>

    </div>

      </div>
      <div class="field">
        <label>Type</label>
        <div class="segmented type-seg" id="typeSeg">
          <span class="seg-ind"></span>
          <button data-type="single" class="on">One-time</button>
          <button data-type="repeating">Repeating</button>
        </div>
        <div class="seg-note" id="typeNote">Appears only on this day.</div>
      </div>
      <div class="field">
        <label>Category</label>

    </div>
    <div class="modal-foot">

</div>

<!-- Goal modal -->
<div class="overlay" id="goalOverlay">
  <div class="modal wide">
    <div class="modal-head">
      <div class="modal-title">Edit goal</div>
      <div class="modal-sub">name it and set when it starts and ends</div>
    </div>
    <div class="modal-body">
      <div class="field">

      <div class="g-row">
        <div class="field"><label for="gStart">Start date</label><input class="text" id="gStart" type="date" /></div>
        <div class="field"><label for="gEnd">End date</label><input class="text" id="gEnd" type="date" /></div>
      </div>

        <label for="gLen">Length</label>
        <div class="g-row" style="align-items:center"><input class="text" id="gLen" type="number" min="1" max="730" step="1" style="max-width:110px" /><span class="g-eyebrow">days, start and end included</span></div>
        <div class="g-quick" id="gQuick"><button data-len="30">30 days</button><button data-len="60">60 days</button><button data-len="90">90 days</button><button data-len="180">6 months</button><button data-len="365">1 year</button></div>
      </div>

        <div class="g-row" style="align-items:center"><input class="text" id="gTarget" type="number" min="0.5" max="24" step="0.5" style="max-width:110px" /><span class="g-eyebrow">hours a day on average, a bar this tall is full height</span></div>

<!-- Categories modal -->

<!-- Analysis modal -->

      <div class="modal-title">Analysis</div>

    </div>
    <div class="modal-body analysis-body" id="analysisBody"></div>
    <div class="modal-foot">
      <button class="btn primary" id="analysisDone">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORE="daytrack3.v1";
  /* v1, v2 and v3 share the aaron5545.github.io origin, so each uses its own key.
     On first launch, copy the newest older version's data once. */
  try{ if(!localStorage.getItem(STORE)){ var _old=localStorage.getItem("daytrack2.v1")||localStorage.getItem("daytrack.v1"); if(_old){ localStorage.setItem(STORE,_old); } } }catch(e){}
  var DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var CE="cubic-bezier(.2,.8,.2,1)";
  var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.3 4.3L19 7"/></svg>';
  var MOON_SVG='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN_SVG='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var PRESET_COLORS=["#EF4444","#F97316","#F59E0B","#22C55E","#14B8A6","#06B6D4","#3B82F6","#6366F1","#A855F7","#EC4899"];

  var DEFAULT_CATS=[
    {id:"workout", name:"Workout",         color:"#F4511E"},
    {id:"deepwork",name:"Deep Work",       color:"#3F51B5"},
    {id:"sales",   name:"Sales",           color:"#D50000"},
    {id:"meetings",name:"Meetings",        color:"#039BE5"},
    {id:"study",   name:"Study",           color:"#0B8043"},
    {id:"morning", name:"Morning Routine", color:"#616161"}
  ];

  function uid(){
    if(window.crypto && crypto.randomUUID){ try{return crypto.randomUUID();}catch(e){} }
    return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  }
  function cvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

  var state=load();
  function load(){
    try{
      var raw=localStorage.getItem(STORE);
      if(raw){
        var d=JSON.parse(raw);
        return {
          tasks:Array.isArray(d.tasks)?d.tasks:[],
          completions:(d.completions&&typeof d.completions==="object")?d.completions:{},
          categories:(Array.isArray(d.categories)&&d.categories.length)?d.categories:DEFAULT_CATS.slice(),
          view:(d.view==="day"||d.view==="3day"||d.view==="week")?d.view:"week",
          milestone:(d.milestone&&typeof d.milestone==="object")?d.milestone:null,
          hours:{log:(d.hours&&d.hours.log&&typeof d.hours.log==="object")?d.hours.log:{}},
          theme:(d.theme==="dark")?"dark":"light"
        };
      }
    }catch(e){}
    return {tasks:[],completions:{},categories:DEFAULT_CATS.slice(),view:"week",milestone:null,hours:{log:{}},theme:"light"};
  }
  function save(){
    try{ localStorage.setItem(STORE,JSON.stringify({tasks:state.tasks,completions:state.completions,categories:state.categories,view:state.view,milestone:state.milestone,hours:state.hours,theme:state.theme})); }catch(e){}
  }

  function ensureOrders(){
    var needs=state.tasks.some(function(t){return typeof t.order!=="number";});
    if(!needs) return false;
    var maxO=state.tasks.reduce(function(m,t){return typeof t.order==="number"?Math.max(m,t.order):m;},0);
    var rep=state.tasks.filter(function(t){return typeof t.order!=="number"&&t.type==="repeating";}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
    var sng=state.tasks.filter(function(t){return typeof t.order!=="number"&&t.type!=="repeating";}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
    var o=maxO+1;
    rep.forEach(function(t){t.order=o++;});
    if(o<100000)o=100000;
    sng.forEach(function(t){t.order=o++;});
    return true;
  }

  function fmtISO(dt){var y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,"0"),d=String(dt.getDate()).padStart(2,"0");return y+"-"+m+"-"+d;}
  function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(dt,n){var x=new Date(dt);x.setDate(x.getDate()+n);return x;}
  function weekStartOf(dt){var x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());var off=(x.getDay()+6)%7;return addDays(x,-off);}
  function createdISO(t){return fmtISO(new Date(t.createdAt||0));}
  function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

  var todayISO=fmtISO(new Date());
  var anchor=parseISO(todayISO);
  var meterMode="range";

  function catById(id){for(var i=0;i<state.categories.length;i++){if(state.categories[i].id===id)return state.categories[i];}return null;}
  function taskById(id){for(var i=0;i<state.tasks.length;i++){if(state.tasks[i].id===id)return state.tasks[i];}return null;}
  function ord(t){return typeof t.order==="number"?t.order:(t.createdAt||0);}
  function tasksForDay(dayISO){
    var list=state.tasks.filter(function(t){return t.type==="repeating"?true:t.date===dayISO;});
    list.sort(function(a,b){var d=ord(a)-ord(b); return d!==0?d:((a.createdAt||0)-(b.createdAt||0));});
    return list;
  }
  function maxOrder(){return state.tasks.reduce(function(m,t){return Math.max(m,ord(t));},0);}
  function compKey(id,day){return id+"|"+day;}
  function isDone(id,day){return !!state.completions[compKey(id,day)];}
  function dayTotals(iso){
    var total=0,done=0,list=tasksForDay(iso);
    for(var i=0;i<list.length;i++){total++;if(isDone(list[i].id,iso))done++;}
    return {total:total,done:done};
  }
  function dayTotalsWindowed(iso){
    var total=0,done=0;
    state.tasks.forEach(function(t){
      var applies = t.type==="repeating" ? (createdISO(t)<=iso) : (t.date===iso);
      if(!applies)return;
      total++; if(state.completions[compKey(t.id,iso)])done++;
    });
    return {total:total,done:done};
  }
  function dayRatio(iso){var s=dayTotalsWindowed(iso);return s.total?s.done/s.total:0;}
  function hoursOn(iso){return +state.hours.log[iso]||0;}
  function setHoursOn(iso,val){
    val=Math.max(0,Math.min(24,Math.round(+val||0)));
    if(val>0) state.hours.log[iso]=val; else delete state.hours.log[iso];
    save();
  }
  function monthSuccess(){
    var now=parseISO(todayISO), y=now.getFullYear(), m=now.getMonth(), done=0,total=0;
    for(var d=new Date(y,m,1); fmtISO(d)<=todayISO && d.getMonth()===m; d=addDays(d,1)){
      var s=dayTotals(fmtISO(d)); total+=s.total; done+=s.done;
    }
    return {done:done,total:total};
  }

  function visibleDays(){
    var out=[],i;
    if(state.view==="week"){var s=weekStartOf(anchor);for(i=0;i<7;i++)out.push(addDays(s,i));}
    else if(state.view==="3day"){for(i=0;i<3;i++)out.push(addDays(anchor,i));}
    else{out.push(new Date(anchor));}
    return out;
  }
  function stepSize(){return state.view==="day"?1:state.view==="3day"?3:7;}

  var boardEl=document.getElementById("board");
  var goalEl=document.getElementById("goal");
  var weekLabelEl=document.getElementById("weekLabel");
  var meterLabelEl=document.getElementById("meterLabel");
  var weekFillEl=document.getElementById("weekFill");
  var weekPctEl=document.getElementById("weekPct");
  var weekCountEl=document.getElementById("weekCount");

  function rangeLabel(a,b){
    if(fmtISO(a)===fmtISO(b)) return DOW[(a.getDay()+6)%7]+" "+a.getDate()+" "+MONTHS[a.getMonth()]+" "+a.getFullYear();
    if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()) return a.getDate()+" \u2013 "+b.getDate()+" "+MONTHS[a.getMonth()]+" "+a.getFullYear();
    if(a.getFullYear()===b.getFullYear()) return a.getDate()+" "+MONTHS[a.getMonth()].slice(0,3)+" \u2013 "+b.getDate()+" "+MONTHS[b.getMonth()].slice(0,3)+" "+a.getFullYear();
    return a.getDate()+" "+MONTHS[a.getMonth()].slice(0,3)+" "+a.getFullYear()+" \u2013 "+b.getDate()+" "+MONTHS[b.getMonth()].slice(0,3)+" "+b.getFullYear();
  }

  var drag={id:null,fromDay:null};
  var dropLine=null;
  function ensureDropLine(){ if(!dropLine){dropLine=document.createElement("div");dropLine.className="drop-line";} return dropLine; }
  function clearDrag(){
    if(dropLine&&dropLine.parentNode)dropLine.parentNode.removeChild(dropLine);
    boardEl.querySelectorAll(".col.drop-active").forEach(function(c){c.classList.remove("drop-active");});
    drag.id=null;drag.fromDay=null;
  }
  function getAfterElement(listEl,y){
    var rows=Array.prototype.slice.call(listEl.querySelectorAll(".task:not(.dragging)"));
    for(var i=0;i<rows.length;i++){var r=rows[i].getBoundingClientRect();if(y<r.top+r.height/2)return rows[i];}
    return null;
  }
  function performDrop(dayISO,listEl,afterEl){
    var t=taskById(drag.id); if(!t){clearDrag();return;}
    var rows=Array.prototype.slice.call(listEl.querySelectorAll(".task")).filter(function(r){return !r.classList.contains("dragging");});
    var before=null,after=null;
    if(afterEl){
      after=taskById(afterEl.getAttribute("data-task"));
      var idx=rows.indexOf(afterEl);
      if(idx>0) before=taskById(rows[idx-1].getAttribute("data-task"));
    }else if(rows.length){
      before=taskById(rows[rows.length-1].getAttribute("data-task"));
    }
    var bo=before?ord(before):null, ao=after?ord(after):null, no;
    if(bo==null&&ao==null) no=0;
    else if(bo==null) no=ao-1;
    else if(ao==null) no=bo+1;
    else no=(bo+ao)/2;
    t.order=no;
    if(t.type!=="repeating" && t.date!==dayISO) t.date=dayISO;
    save(); clearDrag(); renderBoard(false); renderGoal();
  }

  function taskRow(t,dayISO){
    var done=isDone(t.id,dayISO);
    var row=document.createElement("div");

    row.setAttribute("data-task",t.id);
    row.setAttribute("data-day",dayISO);
    row.draggable=true;
    row.addEventListener("dragstart",function(e){
      drag.id=t.id;drag.fromDay=dayISO;
      if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",t.id);}catch(_){}}
      setTimeout(function(){row.classList.add("dragging");},0);
    });
    row.addEventListener("dragend",function(){ row.classList.remove("dragging"); clearDrag(); });

    var chk=document.createElement("button");

    chk.setAttribute("aria-pressed",done?"true":"false");

    del.addEventListener("click",function(){ deleteTask(t); });

    return row;
  }

  function buildColumn(dayDate,idx,animate){
    var dayISO=fmtISO(dayDate),wd=(dayDate.getDay()+6)%7;
    var list=tasksForDay(dayISO),total=list.length,done=0;
    for(var j=0;j<list.length;j++){if(isDone(list[j].id,dayISO))done++;}
    var pct=total?Math.round(done/total*100):0;

    var col=document.createElement("div");
    col.className="col"+(animate?" animate":"");
    col.setAttribute("data-day",dayISO);
    if(animate) col.style.animationDelay=(idx*0.04)+"s";
    if(dayISO===todayISO)col.classList.add("is-today");
    else if(dayISO<todayISO)col.classList.add("is-past");
    if(total>0&&done===total)col.classList.add("full");

    col.innerHTML=
      '<div class="spine"><div class="lvl" style="height:'+pct+'%"></div></div>'+
      '<div class="col-head"><div class="dow">'+DOW[wd]+'</div>'+
      '<div class="datenum-row"><span class="datenum">'+dayDate.getDate()+'</span>'+
      '<span class="frac"><b>'+done+'</b>/'+total+'</span></div></div>';

    var listEl=document.createElement("div");listEl.className="tasklist";
    if(total===0){var em=document.createElement("div");em.className="empty";em.textContent="No tasks yet.";listEl.appendChild(em);}
    else{for(var k=0;k<list.length;k++)listEl.appendChild(taskRow(list[k],dayISO));}

    listEl.addEventListener("dragover",function(e){
      if(!drag.id)return;
      e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect="move";
      col.classList.add("drop-active");
      var afterEl=getAfterElement(listEl,e.clientY);
      var line=ensureDropLine();
      if(afterEl) listEl.insertBefore(line,afterEl); else listEl.appendChild(line);
    });
    listEl.addEventListener("dragleave",function(e){
      if(e.target===listEl && !listEl.contains(e.relatedTarget)) col.classList.remove("drop-active");
    });
    listEl.addEventListener("drop",function(e){
      if(!drag.id)return;
      e.preventDefault();
      performDrop(dayISO,listEl,getAfterElement(listEl,e.clientY));
    });
    col.appendChild(listEl);

    var add=document.createElement("button");
    add.className="add-task";add.innerHTML='<span class="plus">+</span> Add task';
    add.setAttribute("data-day",dayISO);
    add.addEventListener("click",function(ev){ openTaskModal(ev.currentTarget.getAttribute("data-day")); });
    col.appendChild(add);
    return col;
  }

  // type an exact number of hours in place of a value element
  function editHoursInline(el,dayISO,cls){
    var inp=document.createElement("input");
    inp.type="number"; inp.min="0"; inp.max="24"; inp.step="1"; inp.inputMode="numeric"; inp.className=cls;
    inp.addEventListener("wheel",function(e){ e.preventDefault(); },{passive:false});
    inp.value=hoursOn(dayISO)||"";
    inp.placeholder="0";
    el.parentNode.replaceChild(inp,el); inp.focus(); inp.select();
    var done=false;
    function finish(save){ if(done)return; done=true; if(save) commitHours(dayISO,inp.value); else refreshHoursUI(); }
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();finish(true);}
      else if(e.key==="Escape"){e.preventDefault();finish(false);}

  function commitHours(dayISO,val){ setHoursOn(dayISO,val); refreshHoursUI(); }

  function renderBoard(animate){

  function cssq(s){ return s.replace(/"/g,'\\"'); }
  function colFor(dayISO){ return boardEl.querySelector('.col[data-day="'+cssq(dayISO)+'"]'); }

  function updateDayStats(dayISO){
    var col=colFor(dayISO); if(!col) return;
    var listEl=col.querySelector(".tasklist");
    var rows=listEl.querySelectorAll(".task");
    var total=rows.length,done=0;
    rows.forEach(function(r){ if(r.classList.contains("done"))done++; });
    var pct=total?Math.round(done/total*100):0;
    col.querySelector(".lvl").style.height=pct+"%";
    col.querySelector(".frac").innerHTML="<b>"+done+"</b>/"+total;
    col.classList.toggle("full", total>0&&done===total);

      var em=document.createElement("div");em.className="empty";em.textContent="No tasks yet.";listEl.appendChild(em);
    }
