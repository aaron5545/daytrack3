  function updateMeter(){
    var done=0,total=0,label;
    if(meterMode==="month"){ var s=monthSuccess(); done=s.done; total=s.total; label="Month success"; }
    else{
      visibleDays().forEach(function(d){var v=dayTotals(fmtISO(d));total+=v.total;done+=v.done;});
      label=state.view==="day"?"Day success":state.view==="3day"?"3-day success":"Week success";
    }
    var pct=total?Math.round(done/total*100):0;
    weekFillEl.style.width=pct+"%";
    weekPctEl.textContent=pct+"%";
    weekPctEl.style.color=pct===100?"var(--accent)":"var(--ink)";
    weekCountEl.textContent=done+" / "+total+" done";
    meterLabelEl.textContent=label;
  }

  function toggleTask(t,dayISO,row,chk){
    var k=compKey(t.id,dayISO),now=!state.completions[k];
    if(now)state.completions[k]=true; else delete state.completions[k];
    save();
    row.classList.toggle("done",now);
    chk.classList.toggle("done",now);
    chk.setAttribute("aria-pressed",now?"true":"false");
    updateDayStats(dayISO);
    updateMeter();
    renderGoal();
  }

  function startRename(row,titleEl,t){
    row.draggable=false;
    var inp=document.createElement("input");
    inp.className="rename-input";inp.value=t.title;
    row.replaceChild(inp,titleEl);inp.focus();inp.select();
    var closed=false;
    function finish(){ row.draggable=true; }
    function commit(){
      if(closed)return;closed=true;
      var v=inp.value.trim();
      if(inp.parentNode) row.replaceChild(titleEl,inp);
      if(v && v!==t.title){ t.title=v; save(); refreshTaskTitle(t.id,v); }
      finish();
    }
    function cancel(){ if(closed)return;closed=true; if(inp.parentNode) row.replaceChild(titleEl,inp); finish(); }
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();commit();}
      else if(e.key==="Escape"){e.preventDefault();cancel();}
    });
    inp.addEventListener("blur",commit);
  }
  function refreshTaskTitle(taskId,title){
    boardEl.querySelectorAll('.task[data-task="'+cssq(taskId)+'"] .tt-inner').forEach(function(el){ el.textContent=title; });
  }

  function deleteTask(t){
    if(t.type==="repeating"){
      if(!window.confirm('Delete the repeating task "'+t.title+'" from every day?')) return;
    }
    state.tasks=state.tasks.filter(function(x){return x.id!==t.id;});
    for(var key in state.completions){ if(state.completions.hasOwnProperty(key)&&key.indexOf(t.id+"|")===0) delete state.completions[key]; }
    save();
    var rows=boardEl.querySelectorAll('.task[data-task="'+cssq(t.id)+'"]');
    var days=[];
    if(rows.length===0){ updateMeter(); renderGoal(); return; }
    rows.forEach(function(row){
      var day=row.getAttribute("data-day"); if(days.indexOf(day)<0)days.push(day);
      row.style.height=row.offsetHeight+"px";
      void row.offsetHeight;
      row.style.transition="height .26s "+CE+",opacity .2s "+CE+",margin .26s "+CE+",padding .26s "+CE;
      row.style.opacity="0";row.style.height="0px";row.style.paddingTop="0";row.style.paddingBottom="0";row.style.marginTop="0";row.style.marginBottom="0";
      var gone=false;
      function fin(){ if(gone)return;gone=true; if(row.parentNode)row.parentNode.removeChild(row); days.forEach(updateDayStats); updateMeter(); renderGoal(); }
      row.addEventListener("transitionend",fin);
      setTimeout(fin,340);
    });
  }

  // ---------- Goal ----------
  var goalSel=null;   // day picked in the goal chart for logging hours (null = today)
  var PENCIL_SVG='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  function ensureMilestone(){
    var m=state.milestone,changed=false;
    if(!m||typeof m!=="object"){state.milestone={name:"Launch",start:todayISO,total:30};return true;}
    if(!m.start||!/^\d{4}-\d{2}-\d{2}$/.test(m.start)){m.start=todayISO;changed=true;}
    if(typeof m.total!=="number"||!(m.total>=1)){m.total=30;changed=true;}
    if(typeof m.name!=="string"||!m.name.trim()){m.name="Launch";changed=true;}
    if(!(+m.target>0)){m.target=4;changed=true;}
    return changed;
  }
  function goalValues(){
    var m=state.milestone;
    var total=Math.max(1,Math.round(m.total));
    var raw=daysBetween(m.start,todayISO);           // <0 means the goal hasn't started yet
    var elapsed=Math.max(0,Math.min(total,raw));
    var lastIdx=Math.min(raw,total-1);                // last day that has happened (today, or the final day)
    var sum=0,counted=Math.max(0,lastIdx+1);
    for(var i=0;i<counted;i++) sum+=hoursOn(fmtISO(addDays(parseISO(m.start),i)));
    return {name:m.name,start:m.start,total:total,raw:raw,elapsed:elapsed,left:total-elapsed,lastIdx:lastIdx,
            end:fmtISO(addDays(parseISO(m.start),total-1)),hours:sum,avg:counted?sum/counted:0,counted:counted};
  }
  function shortDate(iso,withYear){var d=parseISO(iso);return DOW[(d.getDay()+6)%7]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+(withYear?" "+d.getFullYear():"");}
  function tinyDate(iso){var d=parseISO(iso);return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);}
  function r1(n){return Math.round(n*10)/10;}
  function goalDay(){ return goalSel||todayISO; }
  function hoursTarget(){ var t=+state.milestone.target; return (t>0&&t<=24)?t:4; }

  function renderGoal(){
    if(!goalEl) return;
    if(ensureMilestone()) save();
    var v=goalValues();
    if(goalSel && (goalSel>todayISO)) goalSel=null;
    var day=goalDay(), h=hoursOn(day);
    var dayNo=v.raw<0?0:Math.min(v.total,v.raw+1);
    var meta=v.raw<0 ? "Starts "+shortDate(v.start)+" · in "+(-v.raw)+" day"+(v.raw===-1?"":"s")
           : v.left===0 ? "Finished on "+shortDate(v.end,true)
           : "Day "+dayNo+" of "+v.total+" · ends "+shortDate(v.end,true);
    var dayLbl=day===todayISO?"today":shortDate(day);
    goalEl.innerHTML=
      '<div class="g-left">'+
        '<div class="g-sec">'+
          '<div class="g-head">'+
            '<div style="min-width:0"><div class="g-eyebrow">Goal</div>'+
            '<button class="g-title" id="gTitle" title="Click to rename"><span>'+escapeHtml(v.name)+'</span>'+PENCIL_SVG+'</button></div>'+
            '<button class="g-btn" id="gEditBtn" title="Change name, start and end dates">'+PENCIL_SVG+'Edit goal</button>'+
          '</div>'+
          '<button class="g-days" id="gDaysBtn" title="Change the dates"><span class="g-big">'+(v.raw<0?v.total:v.left)+'</span><span class="g-tot">/'+v.total+'</span><span class="g-unit">'+(v.raw<0?"days total":"days left")+'</span></button>'+
          '<div class="g-prog"><div style="width:'+Math.round(v.elapsed/v.total*100)+'%"></div></div>'+
          '<div class="g-meta">'+meta+'</div>'+
        '</div>'+
        '<div class="g-sec">'+
          '<div class="g-hrow"><span class="g-eyebrow">'+(day===todayISO?'Hours worked · <b>today</b>':'Hours · <b>'+dayLbl+'</b>')+'</span>'+(day!==todayISO?'<button class="g-link" id="gBackToday">← Today</button>':'')+'</div>'+
          '<div class="g-hctl">'+
            '<div class="g-stepper"><button class="g-step" id="gMinus" aria-label="One hour less"'+(h<=0?' disabled':'')+'>−</button>'+
            '<button class="g-hval" id="gHval" title="Click to type the hours">'+h+'<small>h</small></button>'+
            '<button class="g-step" id="gPlus" aria-label="One hour more"'+(h>=24?' disabled':'')+'>+</button></div>'+
            '<div class="g-hstats"><span><b>'+r1(v.avg)+'h</b> avg / day</span><span><b>'+v.hours+'h</b> total</span><span class="g-tgt">target '+hoursTarget()+'h / day</span></div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="g-right"><div class="g-tip" id="gTip"></div><div class="g-chart" id="gChart"></div></div>';
    document.getElementById("gEditBtn").addEventListener("click",function(){openGoalModal("gName");});
    document.getElementById("gDaysBtn").addEventListener("click",function(){openGoalModal("gEnd");});
    document.getElementById("gTitle").addEventListener("click",renameGoalInline);
    document.getElementById("gMinus").addEventListener("click",function(){ commitHours(goalDay(),hoursOn(goalDay())-1); });
    document.getElementById("gPlus").addEventListener("click",function(){ commitHours(goalDay(),hoursOn(goalDay())+1); });
    document.getElementById("gHval").addEventListener("click",function(){ editHoursInline(document.getElementById("gHval"),goalDay(),"g-hin"); });
    var back=document.getElementById("gBackToday");
    if(back) back.addEventListener("click",function(){ goalSel=null; renderGoal(); });
    drawGoalChart(v);
  }

  function renameGoalInline(){
    var btn=document.getElementById("gTitle"), m=state.milestone;
    var inp=document.createElement("input"); inp.className="g-title-in"; inp.value=m.name; inp.maxLength=40;
    btn.parentNode.replaceChild(inp,btn); inp.focus(); inp.select();
    var done=false;
    function finish(saveIt){ if(done)return; done=true; if(saveIt){ var v=inp.value.trim(); if(v&&v!==m.name){ m.name=v; save(); toast("Goal renamed"); } } renderGoal(); }
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();finish(true);} else if(e.key==="Escape"){e.preventDefault();finish(false);} });
    inp.addEventListener("blur",function(){finish(true);});
  }

  function goalTipHTML(v,iso,hovering){
    var sep='<span class="dotsep">·</span>';
    if(!iso) return '<span>Hover a day for details '+sep+' click it to log its hours</span>';
    var s=dayTotalsWindowed(iso), future=iso>todayISO;
    var html='<b>'+shortDate(iso)+'</b>'+(iso===todayISO?' <span>(today)</span>':'');
    if(future) html+=' '+sep+' <span>upcoming</span>';
    else html+=' '+sep+' <span>tasks '+(s.total?Math.round(s.done/s.total*100)+'% ('+s.done+'/'+s.total+')':'–')+'</span> '+sep+' <span>'+hoursOn(iso)+'h worked</span>';
    if(!hovering && !future) html+=' <button class="g-link" id="gOpenDay">Open day →</button>';
    return html;
  }

  function drawGoalChart(v){
    var holder=document.getElementById("gChart"), tip=document.getElementById("gTip"); if(!holder)return;
    function idleTip(){
      tip.innerHTML=goalTipHTML(v,goalSel,false);
      var od=document.getElementById("gOpenDay");
      if(od) od.addEventListener("click",function(){ anchor=parseISO(goalSel); renderAll(true); window.scrollTo({top:0,behavior:"smooth"}); });
    }
    idleTip();
    var CG=cvar('--cd-green'), CS=cvar('--cd-stub'), CT=cvar('--cd-today'), CL=cvar('--line'), CF=cvar('--faint'), CH=cvar('--hover-2'), CA=cvar('--accent'), CAS=cvar('--accent-soft');
    holder.innerHTML='';
    var W=Math.max(200,Math.floor(holder.clientWidth||holder.getBoundingClientRect().width||420));
    var LW=48, gap=18, axisH=18;
    var avail=holder.clientHeight||0, rowH=Math.max(50,Math.min(92,Math.floor((avail-gap-axisH-2)/2)));
    var b1=rowH, b2=rowH*2+gap, H=b2+axisH;
    var total=v.total, slot=(W-LW)/total, barW=Math.max(1.5,Math.min(slot*0.64,18)), rx=Math.min(2,barW/2);
    var target=hoursTarget(), peak=target; for(var k=0;k<=v.lastIdx;k++){var hk=hoursOn(fmtISO(addDays(parseISO(v.start),k))); if(hk>peak)peak=hk;}
    var showVals=slot>=15, sel=goalDay();
    var mono='font-family:\'IBM Plex Mono\',monospace;';
    var out='', cols='';
    out+='<text x="0" y="'+(b1-2)+'" style="'+mono+'font-size:10px;letter-spacing:.08em;fill:'+CF+'">TASKS</text>';
    out+='<text x="0" y="'+(b2-2)+'" style="'+mono+'font-size:10px;letter-spacing:.08em;fill:'+CF+'">HOURS</text>';
    out+='<line x1="'+LW+'" y1="'+(b1+.5)+'" x2="'+W+'" y2="'+(b1+.5)+'" stroke="'+CL+'"/><line x1="'+LW+'" y1="'+(b2+.5)+'" x2="'+W+'" y2="'+(b2+.5)+'" stroke="'+CL+'"/>';
    // daily target line in the hours row
    var ty=(b2-(3+target/peak*(rowH-18))).toFixed(1);
    out+='<line x1="'+LW+'" y1="'+ty+'" x2="'+W+'" y2="'+ty+'" stroke="'+CF+'" stroke-dasharray="3 4" stroke-opacity=".7"/>';
    out+='<text x="'+(LW-6)+'" y="'+(+ty+3.5)+'" text-anchor="end" style="'+mono+'font-size:9.5px;fill:'+CF+'">'+target+'h</text>';
    // date axis: start, today, end (+ month starts on long goals)
    var ticks=[{i:0,t:tinyDate(v.start),a:"start"},{i:total-1,t:tinyDate(v.end),a:"end"}];
    if(v.raw>=0 && v.raw<total) ticks.push({i:v.raw,t:"today",a:"middle",today:true});
    if(total>45){ for(var q=1;q<total-1;q++){ var dq=addDays(parseISO(v.start),q); if(dq.getDate()===1) ticks.push({i:q,t:MONTHS[dq.getMonth()].slice(0,3),a:"middle",month:true}); } }
    var placed=[];
    ticks.sort(function(a,b){return (b.today?1:0)-(a.today?1:0)||(a.month?1:0)-(b.month?1:0);}).forEach(function(tk){
      var x=LW+tk.i*slot+slot/2, anchorX=tk.a==="start"?"start":tk.a==="end"?"end":"middle";
      var xx=tk.a==="start"?LW+1:tk.a==="end"?W-1:x;
      var est=tk.t.length*6.2, l=anchorX==="start"?xx:anchorX==="end"?xx-est:xx-est/2, r=l+est;
      for(var z=0;z<placed.length;z++){ if(l<placed[z][1]+8 && r>placed[z][0]-8) return; }
      placed.push([l,r]);
      if(tk.month) out+='<line x1="'+(LW+tk.i*slot).toFixed(1)+'" y1="'+(b2+3)+'" x2="'+(LW+tk.i*slot).toFixed(1)+'" y2="'+(b2+7)+'" stroke="'+CF+'"/>';
      out+='<text x="'+xx.toFixed(1)+'" y="'+(H-3)+'" text-anchor="'+anchorX+'" style="'+mono+'font-size:10px;fill:'+(tk.today?CT:CF)+(tk.today?';font-weight:500':'')+'">'+tk.t+'</text>';
    });
    for(var i=0;i<total;i++){
      var x=LW+i*slot+slot/2, iso=fmtISO(addDays(parseISO(v.start),i)), bx=(x-barW/2).toFixed(1), bw=barW.toFixed(1);
      var isToday=(iso===todayISO), isSel=(iso===sel), past=(i<=v.lastIdx), col=isSel?CT:CG;
      cols+='<rect class="g-col" data-iso="'+iso+'" x="'+(LW+i*slot).toFixed(1)+'" y="0" width="'+slot.toFixed(1)+'" height="'+(b2+2)+'" fill="'+CH+'" fill-opacity="'+(isSel?"1":"0")+'" rx="3"/>';
      if(past){
        var r=dayRatio(iso), h1=r>0?3+r*(rowH-10):3;
        out+='<rect x="'+bx+'" y="'+(b1-h1).toFixed(1)+'" width="'+bw+'" height="'+h1.toFixed(1)+'" rx="'+rx+'" fill="'+(r>0?col:CS)+'"/>';
        var hr=hoursOn(iso), h2=hr>0?3+hr/peak*(rowH-18):3;
        out+='<rect x="'+bx+'" y="'+(b2-h2).toFixed(1)+'" width="'+bw+'" height="'+h2.toFixed(1)+'" rx="'+rx+'" fill="'+(hr>0?col:CS)+'"/>';
        if(hr>0&&showVals) out+='<text x="'+x.toFixed(1)+'" y="'+(b2-h2-4).toFixed(1)+'" text-anchor="middle" style="'+mono+'font-size:9.5px;fill:'+(isSel?CT:CF)+'">'+hr+'</text>';
      } else {
        var last=(i===total-1);
        out+='<rect x="'+bx+'" y="'+(b1-3)+'" width="'+bw+'" height="3" rx="'+rx+'" fill="'+(last?CA:CS)+'"/>';
        out+='<rect x="'+bx+'" y="'+(b2-3)+'" width="'+bw+'" height="3" rx="'+rx+'" fill="'+(last?CA:CS)+'"/>';
      }
    }
    holder.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+cols+out+'</svg>';
    holder.querySelectorAll(".g-col").forEach(function(rct){
      var iso=rct.getAttribute("data-iso"), isSel=(iso===sel);
      rct.addEventListener("mouseenter",function(){ if(!isSel) rct.setAttribute("fill-opacity",".6"); tip.innerHTML=goalTipHTML(v,iso,true); });
      rct.addEventListener("mouseleave",function(){ if(!isSel) rct.setAttribute("fill-opacity","0"); idleTip(); });
      rct.addEventListener("click",function(){
        if(iso>todayISO){ toast("That day hasn't happened yet"); return; }
        goalSel=(iso===todayISO)?null:iso; renderGoal();
      });
    });
  }

  // ---- Goal modal ----
  var goalOverlay=document.getElementById("goalOverlay");
  var gTarget=document.getElementById("gTarget"), gName=document.getElementById("gName"), gStart=document.getElementById("gStart"), gEnd=document.getElementById("gEnd"), gLen=document.getElementById("gLen"), gPreview=document.getElementById("gPreview"), gSaveBtn=document.getElementById("gSave");
  var ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
  function lenFromDates(){ if(!ISO_RE.test(gStart.value)||!ISO_RE.test(gEnd.value)) return null; return daysBetween(gStart.value,gEnd.value)+1; }
  function setEndFromLen(){ var n=Math.round(+gLen.value); if(ISO_RE.test(gStart.value)&&n>=1) gEnd.value=fmtISO(addDays(parseISO(gStart.value),Math.min(730,n)-1)); }
  function gDraft(){
    var len=lenFromDates(), tg=Math.round((+gTarget.value||0)*2)/2;
    return {name:gName.value.trim(),start:gStart.value,total:len,target:tg};
  }
  function updateGoalPreview(){
    var d=gDraft(), ok=d.name && ISO_RE.test(d.start) && d.total && d.total>=1 && d.total<=730;
    gPreview.classList.toggle("bad",!ok);
    gSaveBtn.disabled=!ok;
    if(!d.name){ gPreview.textContent="Give your goal a name."; return; }
    if(!d.total||d.total<1){ gPreview.textContent="The end date has to be on or after the start date."; return; }
    if(d.total>730){ gPreview.textContent="Keep it under two years (730 days)."; return; }
    if(!(d.target>=0.5&&d.target<=24)){ gPreview.classList.add("bad"); gSaveBtn.disabled=true; gPreview.textContent="Set a daily hours target between 0.5 and 24."; return; }
    var raw=daysBetween(d.start,todayISO), left=d.total-Math.max(0,Math.min(d.total,raw));
    gPreview.innerHTML='<b>'+d.total+'</b> days · '+(raw<0?'starts in <b>'+(-raw)+'</b> day'+(raw===-1?'':'s'):left===0?'already finished':'<b>'+left+'</b> day'+(left===1?'':'s')+' left')+' · ends <b>'+shortDate(fmtISO(addDays(parseISO(d.start),d.total-1)),true)+'</b>';
  }
  function openGoalModal(focusId){
    var m=state.milestone;
    gName.value=m.name; gStart.value=m.start; gLen.value=m.total; gTarget.value=hoursTarget(); setEndFromLen();
    updateGoalPreview();
    goalOverlay.classList.add("open");
    setTimeout(function(){ var f=document.getElementById(focusId||"gName"); f.focus(); if(f.select) try{f.select();}catch(e){} },80);
  }
  function closeGoalModal(){ goalOverlay.classList.remove("open"); }
  gName.addEventListener("input",updateGoalPreview);
  gTarget.addEventListener("input",updateGoalPreview);
  gTarget.addEventListener("wheel",function(e){ if(document.activeElement===gTarget) e.preventDefault(); },{passive:false});
  gStart.addEventListener("input",function(){ setEndFromLen(); updateGoalPreview(); });
  gStart.addEventListener("change",function(){ setEndFromLen(); updateGoalPreview(); });
  function endChanged(){ var n=lenFromDates(); if(n) gLen.value=n; updateGoalPreview(); }
  gEnd.addEventListener("input",endChanged); gEnd.addEventListener("change",endChanged);
  gLen.addEventListener("input",function(){ setEndFromLen(); updateGoalPreview(); });
  document.getElementById("gQuick").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){ gLen.value=b.getAttribute("data-len"); setEndFromLen(); updateGoalPreview(); });
  });
  [gName,gStart,gEnd,gLen,gTarget].forEach(function(el){ el.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();saveGoal();} }); });
  function saveGoal(){
    updateGoalPreview(); if(gSaveBtn.disabled) return;
    var d=gDraft(); state.milestone={name:d.name,start:d.start,total:d.total,target:d.target}; save(); closeGoalModal(); goalSel=null; renderGoal(); toast("Goal saved");
  }
  gSaveBtn.addEventListener("click",saveGoal);
  document.getElementById("gCancel").addEventListener("click",closeGoalModal);
  document.getElementById("gRestart").addEventListener("click",function(){ var n=lenFromDates()||+gLen.value||30; gStart.value=todayISO; gLen.value=n; setEndFromLen(); updateGoalPreview(); });

  // ---- Toast ----
  var toastEl=document.getElementById("toast"), toastTimer=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove("show");},1800); }

  // ---- Add-task modal ----
  var taskOverlay=document.getElementById("taskOverlay");
  var taskTitleEl=document.getElementById("taskTitle");
  var taskDayLabel=document.getElementById("taskDayLabel");
  var typeSeg=document.getElementById("typeSeg");
  var typeNote=document.getElementById("typeNote");
  var catChips=document.getElementById("catChips");
  var taskSave=document.getElementById("taskSave");
  var modalDay=null,modalType="single",modalCat=null;

  function placeInd(container,instant){
    var ind=container.querySelector(".seg-ind");
    var active=container.querySelector("button.on")||container.querySelector("button");
    if(!ind||!active)return;
    if(instant) ind.style.transition="none";
    ind.style.width=active.offsetWidth+"px";
    ind.style.transform="translateX("+active.offsetLeft+"px)";
    if(instant){ void ind.offsetWidth; ind.style.transition=""; }
  }

  function openTaskModal(dayISO){
    modalDay=dayISO;modalType="single";modalCat=null;
    var d=parseISO(dayISO);
    taskDayLabel.textContent=DOW[(d.getDay()+6)%7]+" \u00b7 "+d.getDate()+" "+MONTHS[d.getMonth()];
    taskTitleEl.value="";
    typeSeg.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-type")==="single");});
    typeNote.textContent="Appears only on this day.";
    renderCatChips();updateSaveState();
    taskOverlay.classList.add("open");
    placeInd(typeSeg,true);
    requestAnimationFrame(function(){ placeInd(typeSeg,true); });
    setTimeout(function(){taskTitleEl.focus();},60);
  }
  function closeTaskModal(){taskOverlay.classList.remove("open");}

  function renderCatChips(){
    catChips.innerHTML="";
    var none=document.createElement("button");
    none.type="button";none.className="chip"+(modalCat===null?" on":"");
    none.innerHTML='<span class="sw" style="background:var(--line-strong)"></span>None';
    none.addEventListener("click",function(){modalCat=null;renderCatChips();});
    catChips.appendChild(none);
    state.categories.forEach(function(c){
      var chip=document.createElement("button");chip.type="button";
      chip.className="chip"+(modalCat===c.id?" on":"");
      chip.innerHTML='<span class="sw" style="background:'+c.color+'"></span>'+escapeHtml(c.name);
      chip.addEventListener("click",function(){modalCat=c.id;renderCatChips();});
      catChips.appendChild(chip);
    });
  }
  function updateSaveState(){taskSave.disabled=taskTitleEl.value.trim().length===0;}

  typeSeg.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      modalType=b.getAttribute("data-type");
      typeSeg.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});
      placeInd(typeSeg);
      typeNote.textContent=modalType==="repeating"?"Carries over to every day.":"Appears only on this day.";
    });
  });
  taskTitleEl.addEventListener("input",updateSaveState);
  taskTitleEl.addEventListener("keydown",function(e){if(e.key==="Enter"&&!taskSave.disabled)commitTask();});
  document.getElementById("taskCancel").addEventListener("click",closeTaskModal);
  taskSave.addEventListener("click",commitTask);

  function commitTask(){
    var title=taskTitleEl.value.trim();if(!title)return;
    var newTask={id:uid(),title:title,type:modalType,date:modalType==="single"?modalDay:null,category:modalCat,createdAt:Date.now(),order:maxOrder()+1};
    state.tasks.push(newTask);save();
    closeTaskModal();
    renderBoard(false);
    renderGoal();
    boardEl.querySelectorAll('.task[data-task="'+cssq(newTask.id)+'"]').forEach(function(row){ row.classList.add("entering"); });
  }

  // ---- Categories ----
  var catOverlay=document.getElementById("catOverlay");
  var catList=document.getElementById("catList");
  function openCatModal(){renderCatList();catOverlay.classList.add("open");}
  function closeCatModal(){catOverlay.classList.remove("open");save();renderBoard(false);renderGoal();}
  function sameColor(a,b){return String(a).toLowerCase()===String(b).toLowerCase();}
  function renderCatList(){
    catList.innerHTML="";
    state.categories.forEach(function(c){
      var row=document.createElement("div");row.className="catrow";
      var main=document.createElement("div");main.className="catrow-main";
      var chip=document.createElement("button");chip.type="button";chip.className="cat-swatch";chip.style.background=c.color;chip.setAttribute("aria-label","Choose color for "+c.name);
      var name=document.createElement("input");name.className="cname";name.type="text";name.value=c.name;
      name.addEventListener("input",function(){c.name=name.value;});
      var del=document.createElement("button");del.className="del-cat";del.innerHTML="&times;";del.title="Delete category";
      del.addEventListener("click",function(){
        state.categories=state.categories.filter(function(x){return x.id!==c.id;});
        state.tasks.forEach(function(t){if(t.category===c.id)t.category=null;});
        renderCatList();
      });
      main.appendChild(chip);main.appendChild(name);main.appendChild(del);
      row.appendChild(main);
      var pal=document.createElement("div");pal.className="palette";
      PRESET_COLORS.forEach(function(col){
        var sw=document.createElement("button");sw.type="button";sw.className="swatch"+(sameColor(col,c.color)?" sel":"");sw.style.background=col;sw.setAttribute("aria-label",col);
        sw.addEventListener("click",function(){
          c.color=col;chip.style.background=col;
          pal.querySelectorAll(".swatch").forEach(function(s){s.classList.remove("sel");});
          sw.classList.add("sel");row.classList.remove("open");
        });
        pal.appendChild(sw);
      });
      row.appendChild(pal);
      chip.addEventListener("click",function(){
        var wasOpen=row.classList.contains("open");
        catList.querySelectorAll(".catrow.open").forEach(function(r){r.classList.remove("open");});
        if(!wasOpen) row.classList.add("open");
      });
      catList.appendChild(row);
    });
  }
  document.getElementById("addCatBtn").addEventListener("click",function(){
    state.categories.push({id:uid(),name:"New category",color:PRESET_COLORS[0]});
    renderCatList();catList.scrollTop=catList.scrollHeight;
  });
  document.getElementById("catDone").addEventListener("click",closeCatModal);

  // ---- Analysis ----
  var analysisOverlay=document.getElementById("analysisOverlay");
  var analysisBody=document.getElementById("analysisBody");
  function earliestActivityISO(){
    var days=[];
    state.tasks.forEach(function(t){ if(t.type==="single"&&t.date)days.push(t.date); if(t.createdAt)days.push(createdISO(t)); });
    Object.keys(state.completions).forEach(function(k){var d=k.split("|")[1];if(d)days.push(d);});
    if(!days.length)return null;
    days.sort();
    var first=days[0]; if(first>todayISO)first=todayISO; return first;
  }
  function analyze(){
    var earliest=earliestActivityISO();
    var hk=Object.keys(state.hours.log).sort();
    if(hk.length && (!earliest || hk[0]<earliest)) earliest=hk[0]<=todayISO?hk[0]:earliest;
    if(!earliest)return null;
    var start=parseISO(earliest),end=parseISO(todayISO);
    var cap=addDays(end,-400); if(start<cap)start=cap;
    var days=[],d;
    for(d=new Date(start); fmtISO(d)<=todayISO; d=addDays(d,1)) days.push(fmtISO(d));
    var totalAll=0,doneAll=0,catAgg={},wd=[],i;
    for(i=0;i<7;i++) wd.push({sum:0,n:0});
    days.forEach(function(iso){
      var dt=parseISO(iso),w=(dt.getDay()+6)%7,dtot=0,ddone=0;
      state.tasks.forEach(function(t){
        var applies = t.type==="repeating" ? (createdISO(t)<=iso) : (t.date===iso);
        if(!applies)return;
        var done=!!state.completions[compKey(t.id,iso)];
        dtot++; if(done)ddone++;
        var cid=t.category||"__none";
        if(!catAgg[cid])catAgg[cid]={total:0,done:0};
        catAgg[cid].total++; if(done)catAgg[cid].done++;
      });
      totalAll+=dtot; doneAll+=ddone;
      if(dtot>0){ wd[w].sum+=ddone/dtot; wd[w].n++; }
    });
    var last14=[];
    for(var j=13;j>=0;j--){var iso=fmtISO(addDays(end,-j)),s=dayTotalsWindowed(iso);last14.push({iso:iso,pct:s.total?Math.round(s.done/s.total*100):null,hrs:hoursOn(iso)});}
    var hrsTotal=0; days.forEach(function(iso){hrsTotal+=hoursOn(iso);});
    var best=0,run=0;
    days.forEach(function(iso){var s=dayTotalsWindowed(iso);if(s.total===0)return;if(s.done===s.total){run++;if(run>best)best=run;}else run=0;});
    var cur=0;
    for(var m=days.length-1;m>=0;m--){var s=dayTotalsWindowed(days[m]);if(s.total===0)continue;if(s.done===s.total)cur++;else break;}
    var cats=[];
    Object.keys(catAgg).forEach(function(cid){
      var agg=catAgg[cid]; if(agg.total===0)return;
      var meta = cid==="__none" ? {name:"Uncategorized",color:"#9AA0A8"} : (catById(cid)||{name:"(deleted)",color:"#9AA0A8"});
      cats.push({name:meta.name,color:meta.color,pct:Math.round(agg.done/agg.total*100)});
    });
    cats.sort(function(a,b){return b.pct-a.pct;});
    var weekday=wd.map(function(x){return {pct:x.n?Math.round(x.sum/x.n*100):0,n:x.n};});
    return {overallPct:totalAll?Math.round(doneAll/totalAll*100):0,currentStreak:cur,completedCount:Object.keys(state.completions).length,last14:last14,categories:cats,weekday:weekday,hoursTotal:hrsTotal,hoursAvg:days.length?Math.round(hrsTotal/days.length*10)/10:0,hasData:totalAll>0||hrsTotal>0};
  }
  function statCard(num,cap){ return '<div class="stat-card"><div class="stat-num">'+num+'</div><div class="stat-cap">'+cap+'</div></div>'; }
  function buildAnalysisHTML(a){
    if(!a || !a.hasData) return '<div class="an-empty">No data yet.<br>Check off a few tasks and your stats will appear here.</div>';
    var html="";
    html+='<div class="stat-cards">';
    html+=statCard(a.overallPct+'%','Overall completion');
    html+=statCard(a.currentStreak+(a.currentStreak===1?' day':' days'),'Current streak');
    html+=statCard(a.completedCount,'Tasks completed');
    html+=statCard(a.hoursTotal+'h','Hours \u00b7 avg '+a.hoursAvg+'/day');
    html+='</div>';
    html+='<div><div class="an-h">Daily completion \u00b7 last 14 days</div><div class="day-chart">';
    a.last14.forEach(function(dd,idx){
      var barH=dd.pct==null?3:Math.max(4,Math.round(dd.pct/100*120));
      var cls="day-bar"+(dd.pct==null?" empty":"")+(dd.iso===todayISO?" today":"");
      var lab=DOW[(parseISO(dd.iso).getDay()+6)%7].charAt(0);
      var tip=dd.iso+(dd.pct==null?" \u00b7 no tasks":" \u00b7 "+dd.pct+"%");
      html+='<div class="day-col" title="'+tip+'"><div class="day-bar-area"><div class="'+cls+'" style="height:'+barH+'px;animation-delay:'+(idx*0.03).toFixed(2)+'s"></div></div><span class="day-lbl">'+lab+'</span></div>';
    });
    html+='</div></div>';
    var pk=hoursTarget(); a.last14.forEach(function(dd){if(dd.hrs>pk)pk=dd.hrs;});
    html+='<div><div class="an-h">Hours worked \u00b7 last 14 days</div><div class="day-chart">';
    a.last14.forEach(function(dd,idx){
      var barH=dd.hrs?Math.max(4,Math.round(dd.hrs/pk*120)):3;
      var cls="day-bar"+(dd.hrs?"":" empty")+(dd.iso===todayISO?" today":"");
      var lab=DOW[(parseISO(dd.iso).getDay()+6)%7].charAt(0);
      html+='<div class="day-col" title="'+dd.iso+' \u00b7 '+dd.hrs+'h"><div class="day-bar-area"><div class="'+cls+'" style="height:'+barH+'px;animation-delay:'+(idx*0.03).toFixed(2)+'s"></div></div><span class="day-lbl">'+lab+'</span></div>';
    });
    html+='</div></div>';
    if(a.categories.length){
      html+='<div><div class="an-h">By category</div>';
      a.categories.forEach(function(c,idx){
        html+='<div class="cat-row"><span class="cat-name" title="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</span>'+
              '<div class="cat-track"><div class="cat-fill" style="width:'+c.pct+'%;background:'+c.color+';animation-delay:'+(idx*0.05).toFixed(2)+'s"></div></div>'+
              '<span class="cat-pct">'+c.pct+'%</span></div>';
      });
      html+='</div>';
    }
    html+='<div><div class="an-h">By weekday</div><div class="wd-chart">';
    a.weekday.forEach(function(w,idx){
      var barH=w.n===0?3:Math.max(4,Math.round(w.pct/100*90));
      var cls="wd-bar"+(w.n===0?" empty":"");
      var tip=DOW[idx]+(w.n?" \u00b7 "+w.pct+"%":" \u00b7 no data");
      html+='<div class="wd-col" title="'+tip+'"><div class="wd-area"><div class="'+cls+'" style="height:'+barH+'px;animation-delay:'+(idx*0.04).toFixed(2)+'s"></div></div><span class="wd-lbl">'+DOW[idx]+'</span></div>';
    });
    html+='</div></div>';
    return html;
  }
  function openAnalysis(){ analysisBody.innerHTML=buildAnalysisHTML(analyze()); analysisOverlay.classList.add("open"); }
  function closeAnalysis(){ analysisOverlay.classList.remove("open"); }
  document.getElementById("analysisDone").addEventListener("click",closeAnalysis);

  var overlays=[{el:goalOverlay,close:closeGoalModal},{el:taskOverlay,close:closeTaskModal},{el:catOverlay,close:closeCatModal},{el:analysisOverlay,close:closeAnalysis}];
  overlays.forEach(function(o){ o.el.addEventListener("mousedown",function(e){ if(e.target===o.el) o.close(); }); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      if(menuPop.classList.contains("open")){menuPop.classList.remove("open");return;}
      for(var i=0;i<overlays.length;i++){ if(overlays[i].el.classList.contains("open")){ overlays[i].close(); break; } }
    }
  });

  // ---- Export / Import ----
  var importFile=document.getElementById("importFile");
  function doExport(){
    var payload={app:"daytrack",version:3,exportedAt:new Date().toISOString(),data:{tasks:state.tasks,completions:state.completions,categories:state.categories,milestone:state.milestone,hours:state.hours}};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download="daytrack-backup-"+fmtISO(new Date())+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  importFile.addEventListener("change",function(){
    var f=importFile.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var parsed=JSON.parse(r.result);
        var d=parsed&&parsed.data?parsed.data:parsed;
        if(!d||!Array.isArray(d.tasks))throw new Error("bad");
        if(!window.confirm("Replace your current tasks and categories with this backup? Your present data will be overwritten.")) return;
        state.tasks=d.tasks;
        state.completions=(d.completions&&typeof d.completions==="object")?d.completions:{};
        state.categories=(Array.isArray(d.categories)&&d.categories.length)?d.categories:DEFAULT_CATS.slice();
        state.milestone=(d.milestone&&typeof d.milestone==="object")?d.milestone:null;
        state.hours={log:(d.hours&&d.hours.log&&typeof d.hours.log==="object")?d.hours.log:{}};
        ensureOrders(); ensureMilestone(); save(); renderAll(true); toast("Backup imported");
      }catch(err){ window.alert("That file doesn't look like a Daytrack backup."); }
    };
    r.readAsText(f);
  });

  function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // ---- menu ----
  var menuBtn=document.getElementById("menuBtn"), menuPop=document.getElementById("menuPop"), menuWrap=menuBtn.parentNode;
  menuBtn.addEventListener("click",function(e){e.stopPropagation();menuPop.classList.toggle("open");});
  menuPop.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      var a=b.getAttribute("data-act");
      menuPop.classList.remove("open");
      if(a==="analysis")openAnalysis();
      else if(a==="categories")openCatModal();
      else if(a==="export")doExport();
      else if(a==="import"){importFile.value="";importFile.click();}
    });
  });
  document.addEventListener("click",function(e){ if(menuPop.classList.contains("open") && !menuWrap.contains(e.target)) menuPop.classList.remove("open"); });

  // ---- theme ----
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme==="dark"?"dark":"light");
    var b=document.getElementById("themeBtn"); if(b) b.innerHTML = state.theme==="dark"?SUN_SVG:MOON_SVG;
  }
  document.getElementById("themeBtn").addEventListener("click",function(){
    state.theme = state.theme==="dark"?"light":"dark";
    save(); applyTheme(); renderGoal();
  });

  // ---- view + nav ----
  var viewSeg=document.getElementById("viewSeg");
  viewSeg.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      var v=b.getAttribute("data-view");
      if(v===state.view)return;
      state.view=v;save();
      viewSeg.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});
      placeInd(viewSeg);
      renderAll(true);
    });
  });
  function syncViewSeg(){ viewSeg.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-view")===state.view);}); }

  document.getElementById("prevBtn").addEventListener("click",function(){anchor=addDays(anchor,-stepSize());renderAll(true);});
  document.getElementById("nextBtn").addEventListener("click",function(){anchor=addDays(anchor,stepSize());renderAll(true);});
  document.getElementById("todayBtn").addEventListener("click",function(){anchor=parseISO(todayISO);renderAll(true);});
  meterLabelEl.addEventListener("click",function(){ meterMode = meterMode==="month"?"range":"month"; updateMeter(); });

  var rzTimer=null;
  window.addEventListener("resize",function(){
    placeInd(viewSeg,true);
    if(taskOverlay.classList.contains("open")) placeInd(typeSeg,true);
    clearTimeout(rzTimer);
    rzTimer=setTimeout(function(){ try{ drawGoalChart(goalValues()); }catch(e){} },120);
  });

  function renderAll(animate){
    var days=visibleDays();
    weekLabelEl.textContent=rangeLabel(days[0],days[days.length-1]);
    renderBoard(animate);
    renderGoal();
  }

  setInterval(function(){
    var t=fmtISO(new Date());
    if(t!==todayISO){ if(fmtISO(anchor)===todayISO) anchor=parseISO(t); todayISO=t; renderAll(false); }
  },60000);

  if(ensureOrders()) save();
  ensureMilestone();
  applyTheme();
  syncViewSeg();
  renderAll(true);
  placeInd(viewSeg,true);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ placeInd(viewSeg,true); drawGoalChart(goalValues()); }); }
  setTimeout(function(){ placeInd(viewSeg,true); drawGoalChart(goalValues()); },300);
})();
</script>
